name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't post details of security problems here, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sotto version and how you installed it
      placeholder: e.g. 2.0.1, Fedora package / AppImage
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, desktop and session
      placeholder: e.g. Arch Linux, KDE Plasma 6 / niri / Hyprland, Wayland
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and GPU
      placeholder: e.g. GigaAM v3 / Whisper Large v3 Turbo, Radeon RX 7800 (Vulkan)
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of `journalctl --user -t sotto -n 100` around the problem
      render: text
