name: Release

# A pushed tag vX.Y.Z builds every package, installs and runs each one on its own
# distribution, and publishes them with SHA256SUMS. Run it by hand to get the same
# files as workflow artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WHISPER_VERSION: "1.9.5"
  SHERPA_VERSION: "1.13.8"

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^project(sotto VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $version in CMakeLists.txt"; exit 1
          fi
          grep -qx "pkgver=$version" packaging/arch/PKGBUILD
          grep -Eq "^Version: +$version$" packaging/rpm/sotto.spec
          grep -q "^## \[$version\]" CHANGELOG.md
          grep -q "release version=\"$version\"" packaging/io.github.trendorin.Sotto.metainfo.xml

      - name: Archive
        run: |
          mkdir dist
          v=${{ steps.version.outputs.version }}
          git archive --format=tar.gz --prefix="sotto-$v/" -o "dist/sotto-$v.tar.gz" HEAD

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: dist/*

  arch:
    name: Arch Linux package
    needs: source
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Build dependencies
        run: |
          pacman -Syu --noconfirm --needed cmake ninja python qt6-base qt6-multimedia qt6-wayland layer-shell-qt \
            whisper-cpp ggml ggml-vulkan wl-clipboard xdg-desktop-portal polkit hicolor-icon-theme

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder: .
          cd packaging/arch
          runuser -u builder -- makepkg --noconfirm --cleanbuild
          mkdir -p ../../dist
          mv ./*.pkg.tar.zst ../../dist/

      - name: Install and run
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          pacman -Qkk sotto
          QT_QPA_PLATFORM=offscreen sotto --version
          QT_QPA_PLATFORM=offscreen sotto --models | grep -q gigaam-v3-ru

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  debian:
    name: Debian package
    needs: source
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build dpkg-dev git curl bzip2 ca-certificates \
            python3 qt6-base-dev qt6-qpa-plugins qt6-multimedia-dev qt6-wayland-dev liblayershellqtinterface-dev libvulkan-dev \
            glslc spirv-headers

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: packaging/deb/build.sh

      - name: Install and run
        run: |
          apt-get install -y ./dist/sotto_*.deb
          dpkg -s sotto | grep -E '^(Version|Depends):'
          QT_QPA_PLATFORM=offscreen sotto --version
          QT_QPA_PLATFORM=offscreen sotto --models | grep -q gigaam-v3-ru
          ls /usr/lib/sotto /usr/lib/sotto/ggml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian
          path: dist/*.deb

  fedora:
    name: Fedora package
    needs: source
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False rpm-build cmake ninja-build gcc-c++ python3 bzip2 \
            qt6-qtbase-devel qt6-qtmultimedia-devel qt6-qtwayland-devel layer-shell-qt-devel \
            vulkan-loader-devel glslc spirv-headers-devel

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source
          path: dist

      - name: Build
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          cp dist/sotto-*.tar.gz ~/rpmbuild/SOURCES/
          curl -fsSL --retry 3 -o ~/rpmbuild/SOURCES/whisper.cpp-$WHISPER_VERSION.tar.gz \
            "https://github.com/ggml-org/whisper.cpp/archive/v$WHISPER_VERSION/whisper.cpp-$WHISPER_VERSION.tar.gz"
          curl -fsSL --retry 3 -o ~/rpmbuild/SOURCES/sherpa-onnx-v$SHERPA_VERSION-linux-x64-shared.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$SHERPA_VERSION/sherpa-onnx-v$SHERPA_VERSION-linux-x64-shared.tar.bz2"
          echo "c0bdb7907d3a74bba1d55d22bf4d9fa75586cf1530614ebe88a27b9118e015c4  $HOME/rpmbuild/SOURCES/sherpa-onnx-v$SHERPA_VERSION-linux-x64-shared.tar.bz2" | sha256sum -c
          rpmbuild -bb packaging/rpm/sotto.spec
          rm dist/*
          cp ~/rpmbuild/RPMS/x86_64/sotto-[0-9]*.rpm dist/

      - name: Install and run
        run: |
          dnf install -y ./dist/sotto-*.rpm
          rpm -V sotto
          QT_QPA_PLATFORM=offscreen sotto --version
          QT_QPA_PLATFORM=offscreen sotto --models | grep -q gigaam-v3-ru

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fedora
          path: dist/*.rpm

  appimage:
    name: AppImage
    needs: source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: sudo SOTTO_SRC="$PWD" SOTTO_WORK="$RUNNER_TEMP/sotto" bash packaging/appimage/inside.sh

      - name: Run
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          sudo apt-get install -yq xvfb
          img=$(ls dist/*.AppImage)
          xvfb-run -a "$img" --appimage-extract-and-run --version
          xvfb-run -a "$img" --appimage-extract-and-run --models | grep -q gigaam-v3-ru
          "$img" --appimage-extract >/dev/null
          test -f squashfs-root/usr/lib/libsherpa-onnx-c-api.so
          test -f squashfs-root/usr/lib/libonnxruntime.so
          test -f squashfs-root/usr/plugins/wayland-shell-integration/libxdg-shell.so
          test -f squashfs-root/usr/plugins/platforms/libqwayland-generic.so
          test -f squashfs-root/usr/plugins/platforms/libqxcb.so
          test -f squashfs-root/usr/plugins/iconengines/libqsvgicon.so

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage
          path: dist/*.AppImage

  publish:
    name: Publish
    needs: [source, arch, debian, fedora, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: .github/release-notes.sh "${{ needs.source.outputs.version }}" > notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref_type != 'tag'
        with:
          name: release
          path: |
            dist/*
            notes.md

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Sotto ${{ needs.source.outputs.version }}" --notes-file notes.md
